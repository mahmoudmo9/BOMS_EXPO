<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOMS Expo</title>
<meta name="description" content="ثبت میدانی اطلاعات غرفه‌های نمایشگاه، آفلاین">
<meta name="theme-color" content="#0B0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOMS Expo">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:Vaz;src:url(fonts/vazirmatn-arabic-400-normal.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Vaz;src:url(fonts/vazirmatn-arabic-700-normal.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Vaz;src:url(fonts/vazirmatn-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vaz;src:url(fonts/vazirmatn-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
:root{
  --bg:#0B0F1A;--s1:#121827;--s2:#182036;--s3:#1f2944;--line:#283352;
  --gold:#D9BE8C;--gold2:#E7CC97;--ink:#1a1408;
  --t1:#F4EFE3;--t2:#B9BFCD;--t3:#8C93A6;
  --hot:#F2A08F;--warm:#E7CC97;--cold:#9DB7E0;--good:#9FC7AE;--bad:#F2C3B9;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--t1);font-family:Vaz,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--t1)}
bdi{unicode-bidi:isolate}
.app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 96px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:4px 0 12px}
.top h1{font-size:20px;font-weight:700;line-height:1.4}
.top .m{font-size:12.5px;color:var(--t3)}
.badge{font-size:11.5px;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--t3)}
.badge.ok{background:rgba(159,199,174,.12);color:var(--good);border-color:rgba(159,199,174,.35)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.k{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center}
.k b{display:block;font-size:21px;line-height:1.3}
.k span{font-size:11.5px;color:var(--t3)}
.k.hot b{color:var(--hot)}.k.warm b{color:var(--warm)}.k.cold b{color:var(--cold)}
.note{font-size:12.5px;border-radius:12px;padding:9px 12px;margin-bottom:10px;line-height:1.8}
.note.warn{color:var(--warm);background:rgba(231,204,151,.08);border:1px solid rgba(231,204,151,.3)}
.note.info{color:var(--t2);background:var(--s1);border:1px solid var(--line)}
.note.good{color:var(--good);background:rgba(159,199,174,.08);border:1px solid rgba(159,199,174,.3)}
.note button{color:var(--gold);font-weight:700;margin-inline-start:6px;text-decoration:underline}
.search{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;margin-bottom:10px;outline:none}
.search:focus{border-color:var(--gold)}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--t2);background:var(--s1)}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(217,190,140,.1)}
.card{display:flex;gap:11px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:9px;align-items:center;width:100%;text-align:start}
.card:active{background:var(--s2)}
.thumb{width:62px;height:44px;border-radius:8px;background:var(--s2);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:11px;overflow:hidden}
.ci{flex:1;min-width:0}
.cn{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{font-size:12.5px;color:var(--t3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--s2);color:var(--t2)}
.tag.g{color:var(--gold);background:rgba(217,190,140,.1)}
.tag.w{color:var(--warm);background:rgba(231,204,151,.1)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--s3)}
.d-hot{background:var(--hot)}.d-warm{background:var(--warm)}.d-cold{background:var(--cold)}
.empty{text-align:center;color:var(--t3);padding:40px 10px;font-size:14px;line-height:2}
.fab{position:fixed;bottom:calc(var(--sab) + 84px);left:50%;transform:translateX(-50%);width:min(528px,calc(100% - 32px));height:56px;border-radius:18px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink);font-weight:700;font-size:17px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:5}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,24,39,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(var(--sab) + 8px);z-index:6;backdrop-filter:blur(8px)}
.nav button{font-size:11.5px;color:var(--t3);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:70px;padding:2px 0}
.nav button i{font-style:normal;font-size:19px;line-height:1.2}
.nav button.on{color:var(--gold)}
/* form */
.fhead{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 0 8px;margin:calc(-1 * (var(--sat) + 10px)) 0 6px}
.fhead .t{font-size:17px;font-weight:700}
.fhead button{color:var(--t2);font-size:14.5px;padding:6px 4px}
.sec{font-size:12.5px;color:var(--gold);font-weight:700;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}
.media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.mbtn{height:78px;border-radius:14px;border:1.5px dashed #3a4566;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t2);font-size:12px;gap:2px}
.mbtn i{font-style:normal;font-size:21px;color:var(--gold)}
.mbtn.rec{border-style:solid;border-color:var(--hot);color:var(--hot)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.mi{position:relative;flex:none;width:84px;height:64px;border-radius:10px;overflow:hidden;background:var(--s2);border:1px solid var(--line)}
.mi img{width:100%;height:100%;object-fit:cover;display:block}
.mi .lb{position:absolute;bottom:3px;right:4px;font-size:10px;background:rgba(11,15,26,.8);padding:0 6px;border-radius:5px;color:var(--t2)}
.mi .x{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:rgba(11,15,26,.85);color:var(--t1);font-size:13px;line-height:22px;text-align:center}
.mi.voice{display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:12px;flex-direction:column}
.link{color:var(--gold);font-size:12.5px;text-decoration:underline}
.f{margin-bottom:9px}
.f label{display:block;font-size:12px;color:var(--t3);margin-bottom:4px}
.in{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--gold)}
textarea.in{min-height:64px;resize:vertical;line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.seg button{font-size:13px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--s1);color:var(--t2)}
.seg button.on{border-color:var(--gold);color:var(--gold);background:rgba(217,190,140,.1)}
.seg button.hot.on{border-color:var(--hot);color:var(--hot);background:rgba(242,160,143,.1)}
.seg button.cold.on{border-color:var(--cold);color:var(--cold);background:rgba(157,183,224,.1)}
.contact{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 10px 2px;margin-bottom:8px}
.contact .ch{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--t2);margin-bottom:6px}
.contact .in{background:var(--bg)}
.ghost{width:100%;border:1px dashed #3a4566;border-radius:12px;padding:10px;color:var(--gold);font-size:14px;margin-bottom:4px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--t2);padding:6px 0}
.toggle input{width:20px;height:20px;accent-color:var(--gold)}
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(11,15,26,.97);border-top:1px solid var(--line);padding:10px 16px calc(var(--sab) + 10px);display:flex;gap:8px;z-index:6}
.bar .p{flex:1;height:52px;border-radius:16px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink);font-weight:700;font-size:16.5px}
.bar .s{width:34%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--s1);color:var(--t1);font-size:15px}
.danger{width:100%;margin-top:18px;padding:12px;border-radius:12px;border:1px solid rgba(242,195,185,.35);color:var(--bad);font-size:14px}
/* export & settings */
.box{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.box h3{font-size:15px;margin-bottom:6px}
.box p{font-size:13px;color:var(--t2);line-height:1.9}
.stat{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--t2)}
.stat:last-child{border:none}
.stat b{color:var(--t1)}
.btn{width:100%;min-height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15.5px;margin-bottom:9px;gap:8px;padding:6px 12px}
.btn.g{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink)}
.btn.o{border:1px solid var(--line);background:var(--s1);color:var(--t1);font-weight:400}
.btn:disabled{opacity:.5}
.fu{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.fu .a{font-weight:700;font-size:14.5px}
.fu .d{font-size:12.5px;color:var(--t3)}
.fu .d.late{color:var(--hot)}
.fu a{color:var(--gold);text-decoration:none}
/* overlays */
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 150px);transform:translateX(-50%);background:#232c46;color:var(--t1);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90%;text-align:center}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border-radius:20px 20px 0 0;padding:18px 16px calc(var(--sab) + 16px);width:100%;max-width:560px}
.sheet h3{font-size:16px;margin-bottom:6px}
.sheet p{font-size:13.5px;color:var(--t2);margin-bottom:14px;line-height:1.9}
.viewer{position:fixed;inset:0;background:#000;z-index:25;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="root" class="app"></div>
<nav id="nav" class="nav">
  <button data-v="list" class="on"><i>☰</i>غرفه‌ها</button>
  <button data-v="follow"><i>✓</i>پیگیری‌ها</button>
  <button data-v="export"><i>⇪</i>خروجی</button>
  <button data-v="settings"><i>⚙</i>تنظیم</button>
</nav>
<input id="camIn" type="file" accept="image/*" capture="environment" class="hidden">
<input id="galIn" type="file" accept="image/*" multiple class="hidden">
<script>
'use strict';
const APP_VERSION = '1.0.0';
const SCHEMA = 'boms-expo/1';
const CACHE_NAME = 'boms-expo-v1';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fa = (n) => Number(n || 0).toLocaleString('fa-IR');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const latin = (s) => String(s ?? '').replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const norm = (s) => latin(s).toLowerCase().replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/‌/g, ' ').replace(/\s+/g, ' ').trim();
function normPhone(s) {
  let t = latin(s).replace(/[^\d+]/g, '');
  if (!t) return '';
  if (t.startsWith('00')) t = '+' + t.slice(2);
  if (/^09\d{9}$/.test(t)) t = '+98' + t.slice(1);
  else if (/^9\d{9}$/.test(t)) t = '+98' + t;
  else if (/^98\d{10}$/.test(t)) t = '+' + t;
  else if (/^0\d{10}$/.test(t)) t = '+98' + t.slice(1);
  return t;
}
function fmtDate(s, opts) {
  if (!s) return '';
  const d = new Date(s.length === 10 ? s + 'T12:00:00' : s);
  try { return new Intl.DateTimeFormat('fa-IR-u-ca-persian', opts || { month: 'long', day: 'numeric' }).format(d); } catch (e) { return s; }
}
const fmtTime = (s) => { try { return new Intl.DateTimeFormat('fa-IR', { hour: '2-digit', minute: '2-digit' }).format(new Date(s)); } catch (e) { return ''; } };
function relDay(s) {
  if (!s) return '';
  if (s === todayStr()) return 'امروز';
  if (s === addDays(1)) return 'فردا';
  if (s < todayStr()) return fmtDate(s) + ' (گذشته)';
  return fmtDate(s);
}
const fmtSize = (b) => b > 1048576 ? fa((b / 1048576).toFixed(1)) + ' مگابایت' : fa(Math.max(1, Math.round(b / 1024))) + ' کیلوبایت';
const clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const slug = (s) => latin(s).normalize('NFKD').replace(/[^\w\-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 30);

/* ---------- constants ---------- */
const ROLES = [['manufacturer', 'تولیدکننده'], ['trader', 'بازرگان / توزیع‌کننده'], ['buyer', 'خریدار / مشتری'], ['agent', 'نمایندگی'], ['service', 'خدمات / حمل'], ['other', 'سایر']];
const ROLE_LABEL = Object.fromEntries(ROLES);
const INTEREST = [['hot', 'داغ'], ['warm', 'گرم'], ['cold', 'سرد']];
const INT_LABEL = Object.fromEntries(INTEREST);
const ACTIONS = ['ارسال کاتالوگ', 'استعلام قیمت', 'تماس تلفنی', 'ارسال نمونه', 'بازدید کارخانه', 'جلسه'];
const DEFAULT_CATS = ['فولاد و محصولات فولادی', 'چدن و ریخته‌گری', 'فروآلیاژ', 'نسوز', 'مواد اولیه و قراضه', 'آلومینیوم و غیرآهنی', 'تجهیزات ذوب و کوره', 'ماشین‌آلات و ابزار', 'قطعات و یدکی', 'خدمات و مهندسی'];
const KIND_LABEL = { card: 'کارت', product: 'محصول', voice: 'صدا' };

/* ---------- database ---------- */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('boms-expo', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('booths')) d.createObjectStore('booths', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'id' }).createIndex('booth_id', 'booth_id');
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(storeName, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(storeName, mode);
    const s = t.objectStore(storeName);
    let out;
    const r = fn(s);
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('aborted'));
  });
}
const dbPut = (s, v) => tx(s, 'readwrite', (st) => st.put(v));
const dbGet = (s, k) => tx(s, 'readonly', (st) => st.get(k));
const dbAll = (s) => tx(s, 'readonly', (st) => st.getAll());
const dbDel = (s, k) => tx(s, 'readwrite', (st) => st.delete(k));
const mediaFor = (bid) => tx('media', 'readonly', (st) => st.index('booth_id').getAll(bid));
const mediaKeysAll = () => tx('media', 'readonly', (st) => st.getAll());

/* ---------- state ---------- */
const S = { view: 'list', booths: [], settings: null, filter: 'all', q: '', form: null, formMedia: [], isNew: false, exportFile: null, offlineReady: false };
async function loadSettings() {
  let s = await dbGet('meta', 'settings');
  if (!s) {
    s = { key: 'settings', event: 'ایران متافو', event_en: 'iran-metafo', event_date: todayStr(), cats: DEFAULT_CATS.slice(), seq: 0, last_export_at: null, last_export_kind: null, last_hall: '' };
    await dbPut('meta', s);
  }
  S.settings = s;
}
const saveSettings = () => dbPut('meta', S.settings);
async function loadBooths() { S.booths = (await dbAll('booths')).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || '')); }
const finals = () => S.booths.filter((b) => !b.draft);
function hasContent(b) {
  return !!(b.company || b.company_alt || b.booth || (b.contacts || []).some((c) => c.name || c.mobile || c.email) || b.supplies || b.needs || b.notes || (b.media_count || 0) > 0);
}

/* ---------- ui primitives ---------- */
let toastTimer;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);
}
function ask(title, text, buttons) {
  return new Promise((resolve) => {
    const bg = document.createElement('div');
    bg.className = 'sheetbg';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${buttons.map((b, i) => `<button class="btn ${b.primary ? 'g' : 'o'}" data-i="${i}" ${b.danger ? 'style="color:var(--bad)"' : ''}>${esc(b.label)}</button>`).join('')}</div>`;
    bg.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-i]');
      if (btn) { bg.remove(); resolve(buttons[+btn.dataset.i].value); }
      else if (e.target === bg) { bg.remove(); resolve(null); }
    });
    document.body.appendChild(bg);
  });
}
function setNav(v) { $$('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); $('#nav').classList.toggle('hidden', v === 'form'); }
async function go(v) {
  S.view = v; setNav(v);
  if (v !== 'form') await dbPut('meta', { key: 'open_form', id: null });
  render(); window.scrollTo(0, 0);
}
function render() {
  const r = $('#root');

/* ---------- list ---------- */
function unexported() {
  const t = S.settings.last_export_at;
  return finals().filter((b) => !t || (b.updated_at || '') > t).length;
}
function matchFilter(b) {
  const f = S.filter;
  if (f === 'hot' && b.interest !== 'hot') return false;
  if (f === 'manufacturer' && !(b.roles || []).includes('manufacturer')) return false;
  if (f === 'buyer' && !(b.roles || []).includes('buyer')) return false;
  if (f === 'follow' && !(b.next_action || b.next_due)) return false;
  if (f === 'catalog' && !b.catalog) return false;
  if (S.q) {
    const hay = norm([b.company, b.company_alt, b.hall, b.booth, b.city, b.supplies, b.needs, b.notes, b.price_note, (b.categories || []).join(' '), (b.contacts || []).map((c) => [c.name, c.title, c.mobile, c.email].join(' ')).join(' ')].join(' '));
    if (!norm(S.q).split(' ').every((w) => hay.includes(w))) return false;
  }
  return true;
}
function boothLine(b) {
  const parts = [];
  if (b.hall) parts.push('سالن <bdi>' + esc(b.hall) + '</bdi>');
  if (b.booth) parts.push('غرفه <bdi>' + esc(b.booth) + '</bdi>');
  if (b.city) parts.push(esc(b.city));
  const c = (b.contacts || []).find((x) => x.name);
  if (c) parts.push('<bdi>' + esc(c.name) + '</bdi>');
  return parts.join(' · ') || 'بدون شمارهٔ غرفه';
}
function cardHtml(b) {
  const tags = [];
  (b.roles || []).slice(0, 2).forEach((r) => tags.push(`<span class="tag g">${esc(ROLE_LABEL[r] || r)}</span>`));
  if ((b.categories || [])[0]) tags.push(`<span class="tag">${esc(b.categories[0])}</span>`);
  const nc = (b.contacts || []).filter((c) => c.name || c.mobile || c.email).length;
  if (nc > 1) tags.push(`<span class="tag">${fa(nc)} نفر</span>`);
  if (b.catalog) tags.push('<span class="tag">کاتالوگ ✓</span>');
  if (b.next_due) tags.push(`<span class="tag w">پیگیری ${esc(relDay(b.next_due))}</span>`);
  if (b.draft) tags.push('<span class="tag w">ناتمام</span>');
  const name = b.company || b.company_alt || 'بی‌نام (#' + fa(b.seq) + ')';
  return `<button class="card" data-open="${esc(b.id)}"><span class="dot ${b.interest ? 'd-' + b.interest : ''}" aria-label="${esc(INT_LABEL[b.interest] || 'بدون ارزیابی')}"></span>

/* autosave */
let saveTimer = null;
function touch() { S.form.updated_at = nowIso(); clearTimeout(saveTimer); saveTimer = setTimeout(persistForm, 350); }
async function persistForm() {
  clearTimeout(saveTimer);
  if (!S.form) return;
  const b = S.form;
  b.media_count = S.formMedia.length;
  const firstImg = S.formMedia.find((m) => m.kind === 'card') || S.formMedia.find((m) => m.kind === 'product');
  b.thumb = firstImg ? firstImg.thumb : '';
  await dbPut('booths', b);
  const i = S.booths.findIndex((x) => x.id === b.id);
  if (i >= 0) S.booths[i] = clone(b); else S.booths.unshift(clone(b));
}
function refreshPart(sel, html) { const el = $(sel); if (el) el.innerHTML = html; }
async function finishForm(next) {
  const b = S.form;
  if (!(b.company || b.company_alt || S.formMedia.some((m) => m.kind === 'card') || b.contacts.some((c) => c.name || c.mobile))) {
    toast('حداقل نام شرکت، عکس کارت یا یک شخص لازم است');
    return;
  }
  b.contacts = b.contacts.filter((c, i) => i === 0 || c.name || c.mobile || c.email || c.title || c.note);
  b.contacts.forEach((c) => { c.mobile_e164 = normPhone(c.mobile); c.email = (c.email || '').trim(); });
  b.company_phone_e164 = normPhone(b.company_phone);
  b.hall = latin(b.hall).trim(); b.booth = latin(b.booth).trim().toUpperCase();
  b.draft = false; b.updated_at = nowIso();
  if (b.hall) { S.settings.last_hall = b.hall; await saveSettings(); }
  await persistForm();
  toast(S.isNew ? 'غرفه ثبت شد ✓' : 'ذخیره شد ✓');
  if (next) await openForm(null); else await go('list');
}
async function closeForm() {
  const b = S.form;
  if (S.isNew) {
    if (!hasContent({ ...b, media_count: S.formMedia.length })) { await deleteBooth(b.id, true); return go('list'); }
    const v = await ask('این غرفه ثبت نشده', 'می‌خواهی ثبتش کنی یا کنارش بگذاری و بعداً ادامه بدهی؟', [{ label: 'ثبت', value: 'save', primary: true }, { label: 'نگه دار برای بعد', value: 'keep' }, { label: 'حذف', value: 'del', danger: true }]);
    if (v === 'save') return finishForm(false);
    if (v === 'keep') { await persistForm(); return go('list'); }
    if (v === 'del') { await deleteBooth(b.id, true); return go('list'); }
    return;
  }
  await finishForm(false);
}
async function deleteBooth(id, silent) {
  const ms = await mediaFor(id);
  for (const m of ms) await dbDel('media', m.id);
  await dbDel('booths', id);
  S.booths = S.booths.filter((b) => b.id !== id);
  if (!silent) toast('حذف شد');
}

/* media capture */
let capKind = 'card';
async function compressImage(file, max = 1600, q = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('decode')); i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight;
    const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q));
    const t = document.createElement('canvas'); const ts = Math.min(1, 220 / Math.max(w, h));
    t.width = Math.round(w * ts); t.height = Math.round(h * ts);
    t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
    return { blob, thumb: t.toDataURL('image/jpeg', 0.72) };
  } finally { URL.revokeObjectURL(url); }
}
async function addMedia(kind, blob, thumb) {
  const m = { id: uid(), booth_id: S.form.id, kind, mime: blob.type || (kind === 'voice' ? 'audio/mp4' : 'image/jpeg'), data: await blob.arrayBuffer(), size: blob.size, thumb: thumb || '', created_at: nowIso() };
  await dbPut('media', m);
  S.formMedia.push(m);
  touch(); await persistForm();
  refreshPart('#strip', mediaStrip());
}
async function onFiles(files) {
  for (const f of files) {
    try { const { blob, thumb } = await compressImage(f); await addMedia(capKind, blob, thumb); }
    catch (e) { toast('این عکس خوانده نشد'); }
  }
  toast(capKind === 'card' ? 'عکس کارت ذخیره شد ✓' : 'عکس ذخیره شد ✓');
}
const recState = { on: false, rec: null, chunks: [], stream: null, t0: 0, timer: null };
async function toggleRecord() {
  if (recState.on) { recState.rec.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') { toast('ضبط صدا در این مرورگر پشتیبانی نمی‌شود'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find((m) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    Object.assign(recState, { on: true, rec, chunks: [], stream, t0: Date.now() });
    rec.ondataavailable = (e) => { if (e.data && e.data.size) recState.chunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(recState.timer);

  if (S.view !== 'form' || !S.form) return;
  if (el.dataset.bool) { S.form[el.dataset.bool] = el.checked; return touch(); }
  if (el.dataset.c !== undefined && el.type === 'checkbox') { S.form.contacts[+el.dataset.c].whatsapp = el.checked; return touch(); }
});
$('#camIn').addEventListener('change', async (e) => { const f = Array.from(e.target.files || []); e.target.value = ''; if (f.length && S.form) await onFiles(f); });
$('#galIn').addEventListener('change', async (e) => { const f = Array.from(e.target.files || []); e.target.value = ''; if (f.length && S.form) await onFiles(f); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.view === 'form') persistForm(); });
window.addEventListener('pagehide', () => { if (S.view === 'form') persistForm(); });
function afterRender() { if (S.view === 'form') updateRecBtn(); }

/* ---------- boot ---------- */
async function checkOffline() {
  try { S.offlineReady = !!(navigator.serviceWorker && navigator.serviceWorker.controller) && (await caches.has(CACHE_NAME)); } catch (e) { S.offlineReady = false; }
}
(async function boot() {
  try {
    db = await openDB();
  } catch (e) {
    $('#root').innerHTML = '<div class="empty">ذخیره‌سازی در این مرورگر در دسترس نیست. برنامه را از Safari و از آیکن صفحهٔ اصلی باز کن (نه در حالت Private).</div>';
    return;
  }
  await loadSettings();
  await loadBooths();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('sw.js');
      navigator.serviceWorker.addEventListener('controllerchange', async () => { await checkOffline(); if (S.view === 'list') render(); });
      navigator.serviceWorker.ready.then(async () => { setTimeout(async () => { await checkOffline(); if (S.view === 'list') render(); }, 800); });
    } catch (e) {}
  }
  await checkOffline();
  const of = await dbGet('meta', 'open_form');
  if (of && of.id && S.booths.find((b) => b.id === of.id)) return openForm(of.id);
  render();
})();
</script>
</body>
